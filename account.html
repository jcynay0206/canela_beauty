<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Account — Jonara Beauty</title>
  <meta name="description" content="Manage your Jonara Beauty account and view your orders." />
  <meta property="og:title" content="My Account — Jonara Beauty" />
  <meta property="og:description" content="Manage your Jonara Beauty account and view your orders." />
  <meta property="og:image" content="https://canelabeauty.vercel.app/og-image.jpg" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#FEFCFA" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#FEFCFA;--bg2:#FBF6F1;--bg3:#F7EEE7;--brown:#4A2418;--brown2:#6B3828;--gold:#C4784A;--border:rgba(160,90,60,0.14);--border2:rgba(160,90,60,0.26);--muted:rgba(74,36,24,0.45);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--brown2);}
    nav{display:flex;align-items:center;justify-content:space-between;padding:16px 52px;background:rgba(254,252,250,.97);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;backdrop-filter:blur(16px);}
    .logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;letter-spacing:5px;color:var(--brown);text-transform:uppercase;text-decoration:none;}
    .logo em{font-style:italic;color:var(--gold);}
    .nav-right{display:flex;gap:20px;align-items:center;}
    .nav-right a{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s;}
    .nav-right a:hover{color:var(--brown);}
    .sign-out{background:none;border:1px solid var(--border2);color:var(--muted);padding:7px 14px;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
    .sign-out:hover{border-color:var(--brown);color:var(--brown);}
    .main{max-width:900px;margin:0 auto;padding:52px 24px;}
    .account-header{display:flex;align-items:center;gap:20px;margin-bottom:48px;padding-bottom:28px;border-bottom:1px solid var(--border);}
    .avatar{width:56px;height:56px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--brown);flex-shrink:0;}
    .account-name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--brown);margin-bottom:4px;}
    .account-email{font-size:12px;color:var(--muted);}
    .section-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--brown);margin-bottom:20px;}
    .section-title em{font-style:italic;color:var(--gold);}
    .orders-list{display:flex;flex-direction:column;gap:12px;margin-bottom:48px;}
    .order-card{background:var(--bg2);border:1px solid var(--border);border-radius:3px;padding:20px 24px;}
    .order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
    .order-id{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
    .order-date{font-size:11px;color:var(--muted);}
    .order-items-list{font-size:13px;color:var(--brown2);margin-bottom:12px;line-height:1.7;}
    .order-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
    .order-total{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--brown);font-weight:300;}
    .order-status{font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:2px;}
    .status-pending{background:rgba(196,120,74,.1);color:var(--gold);border:1px solid rgba(196,120,74,.25);}
    .status-shipped{background:rgba(34,120,60,.1);color:#22783C;border:1px solid rgba(34,120,60,.2);}
    .status-delivered{background:rgba(74,36,24,.08);color:var(--brown);border:1px solid var(--border2);}
    .track-link{font-size:10px;color:var(--gold);text-decoration:none;letter-spacing:1px;}
    .track-link:hover{text-decoration:underline;}
    .empty-orders{text-align:center;padding:48px 24px;color:var(--muted);}
    .empty-orders p{margin-bottom:20px;font-size:14px;}
    .shop-btn{display:inline-block;background:var(--brown);color:#FAF6EF;padding:12px 28px;text-decoration:none;font-size:10px;letter-spacing:3px;text-transform:uppercase;border-radius:2px;}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .info-card{background:var(--bg2);border:1px solid var(--border);border-radius:3px;padding:20px;}
    .info-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
    .info-value{font-size:14px;color:var(--brown);}
    @media(max-width:600px){nav{padding:14px 20px;} .main{padding:32px 16px;} .info-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">Jonara <em>Beauty</em></a>
  <div class="nav-right">
    <a href="/">← Shop</a>
    <button class="sign-out" onclick="doSignOut()">Sign Out</button>
  </div>
</nav>

<div class="main">

  <div class="account-header">
    <div class="avatar" id="avatarInitial">?</div>
    <div>
      <p class="account-name" id="accountName">Loading...</p>
      <p class="account-email" id="accountEmail"></p>
    </div>
  </div>

  <h2 class="section-title">My <em>Orders</em></h2>
  <div class="orders-list" id="ordersList">
    <div class="empty-orders"><p>Loading your orders...</p></div>
  </div>

  <h2 class="section-title">Account <em>Info</em></h2>
  <div class="info-grid" id="infoGrid"></div>

</div>

<script type="module">
  import { initializeApp }                     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc }         from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── REPLACE WITH YOUR FIREBASE CONFIG ──
  const firebaseConfig = {
    apiKey: "AIzaSyD__2mpQyP-wOpIyyq7cNlhKBSj6x3lbAI",
    authDomain: "canela-beauty.firebaseapp.com",
    projectId: "canela-beauty",
    storageBucket: "canela-beauty.firebasestorage.app",
    messagingSenderId: "1080295812540",
    appId: "1:1080295812540:web:49b659b17ff7df0d490fb9"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  onAuthStateChanged(auth, async user => {
    if (!user) { location.href = '/auth?redirect=/account'; return; }

    // Header
    const name = user.displayName || user.email.split('@')[0];
    document.getElementById('accountName').textContent  = name;
    document.getElementById('accountEmail').textContent = user.email;
    document.getElementById('avatarInitial').textContent = name.charAt(0).toUpperCase();

    // Firestore profile
    const snap = await getDoc(doc(db,'customers',user.uid));
    const data = snap.exists() ? snap.data() : {};

    // Account info
    document.getElementById('infoGrid').innerHTML = `
      <div class="info-card"><p class="info-label">Name</p><p class="info-value">${name}</p></div>
      <div class="info-card"><p class="info-label">Email</p><p class="info-value">${user.email}</p></div>
      <div class="info-card"><p class="info-label">Phone</p><p class="info-value">${data.phone||'—'}</p></div>
      <div class="info-card"><p class="info-label">Member since</p><p class="info-value">${data.createdAt?new Date(data.createdAt).toLocaleDateString('en-US',{month:'long',year:'numeric'}):'—'}</p></div>`;

    // Orders — fetch from Stripe via email
    try {
      const res    = await fetch('/api/orders');
      const result = await res.json();
      const mine   = (result.orders||[]).filter(o=>o.email===user.email);

      if(!mine.length){
        document.getElementById('ordersList').innerHTML=`
          <div class="empty-orders">
            <p>You haven't placed any orders yet.</p>
            <a href="/" class="shop-btn">Shop Now</a>
          </div>`;
        return;
      }

      document.getElementById('ordersList').innerHTML = mine.map(o=>`
        <div class="order-card">
          <div class="order-top">
            <div>
              <p class="order-id">${o.id.slice(-12).toUpperCase()}</p>
              <p class="order-date">${new Date(o.createdAt).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</p>
            </div>
            <span class="order-status status-${o.status||'pending'}">${(o.status||'Pending').replace('_',' ')}</span>
          </div>
          <p class="order-items-list">${o.items.map(i=>`${i.name} × ${i.qty}`).join(' · ')}</p>
          <div class="order-bottom">
            <span class="order-total">$${o.total} USD</span>
            ${o.trackingUrl?`<a class="track-link" href="${o.trackingUrl}" target="_blank">Track package →</a>`:''}
          </div>
        </div>`).join('');
    } catch(e) {
      document.getElementById('ordersList').innerHTML='<div class="empty-orders"><p>Could not load orders.</p></div>';
    }
  });

  window.doSignOut = async function(){
    await signOut(auth);
    localStorage.removeItem('canela_user');
    location.href = '/';
  };
</script>

</body>
</html>
