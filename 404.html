<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found — Jonara Beauty</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#FEFCFA;--brown:#4A2418;--gold:#C4784A;--muted:rgba(74,36,24,0.45);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--brown);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
    .num{font-family:'Cormorant Garamond',serif;font-size:120px;font-weight:300;color:var(--gold);line-height:1;margin-bottom:8px;opacity:.4;}
    h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:var(--brown);margin-bottom:12px;}
    p{font-size:14px;color:var(--muted);line-height:1.8;max-width:360px;margin-bottom:32px;}
    a{display:inline-block;background:var(--brown);color:#FAF6EF;padding:13px 32px;border-radius:2px;text-decoration:none;font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:500;}
  </style>
</head>
<body>
  <p class="num">404</p>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has been moved. Let's get you back to the good stuff.</p>
  <a href="/">Back to Shop</a>
</body>
</html>
