<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Cancelled — Canela Beauty</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#FAF6EF;--brown:#3D1F00;--gold:#C9941A;--muted:rgba(61,31,0,0.45);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--brown);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
    .icon{width:64px;height:64px;border-radius:50%;background:rgba(61,31,0,0.06);border:1px solid rgba(61,31,0,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:28px;}
    h1{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300;margin-bottom:12px;}
    p{font-size:14px;color:var(--muted);line-height:1.8;max-width:400px;margin-bottom:32px;}
    a{display:inline-block;background:var(--brown);color:#FAF6EF;padding:13px 32px;border-radius:2px;text-decoration:none;font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:500;transition:opacity .2s;}
    a:hover{opacity:.8;}
  </style>
</head>
<body>
  <div class="icon">←</div>
  <h1>No worries, come back anytime</h1>
  <p>Your order was not completed. Your cart items are still saved — head back whenever you're ready.</p>
  <a href="/">Back to Shop</a>
</body>
</html>
